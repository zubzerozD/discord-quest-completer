name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versión (ej. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            src-runner

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dummy runner
        run: pnpm runner:win

      - name: Build Tauri app and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          releaseName: 'Discord Quest Completer v__VERSION__'
          releaseBody: |
            ## Discord Quest Completer v__VERSION__

            ### 📥 Descargas disponibles

            | Opción | Archivo | Descripción |
            | :--- | :--- | :--- |
            | 🚀 **Instalador (Setup)** | `Discord.Quest.Completer_..._x64-setup.exe` | Instalación estándar recomendada. Crea accesos directos y soporta auto-actualizaciones. |
            | 🎒 **Portable (Sin instalar)** | `Discord-Quest-Completer-Portable.zip` | Solo descomprimir y ejecutar directamente. No instala nada ni toca el sistema. |
            | 🏢 **Paquete MSI** | `Discord.Quest.Completer_..._x64_en-US.msi` | Instalador corporativo MSI para Windows. |

            ---

            ### ⚠️ Aviso de Windows SmartScreen ("Windows protegió su PC")
            Al ser una aplicación independiente y gratuita sin un certificado comercial de pago, Windows mostrará la pantalla preventiva de SmartScreen.  
            **Es completamente seguro continuar:**
            1. Haz clic en **"Más información"** (*More info*).
            2. Haz clic en el botón **"Ejecutar de todas formas"** (*Run anyway*).

            ---

            ### 💻 Requisitos
            * Windows 10 u 11 (64-bit)
            * WebView2 Runtime (incluido por defecto en Windows 10 y 11)
          releaseDraft: false
          prerelease: false

      - name: Build portable package
        run: pnpm pack:portable

      - name: Upload portable ZIP to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ inputs.tag_name }}" }
          gh release upload $tag dist-portable/Discord-Quest-Completer-Portable.zip --clobber


